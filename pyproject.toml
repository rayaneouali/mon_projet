[project]
name = "voxmail"
version = "0.1.0"
description = "WhatsApp voice assistant that drafts and sends Gmail emails"
authors = [{ name = "Rayane Ouali" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
voxmail = "voxmail.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern syntax, B: common bugs, ANN: type hints
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
