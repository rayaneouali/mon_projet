# Voice transcription mistakes.
- id: typo_dupond
  category: transcription
  description: "'Dupond' instead of 'Dupont'."
  turns:
    - user: "Envoie un mail à Jean Dupond pour confirmer la livraison des parpaings mercredi."
      expect: {reply_kind: ask_choice, top_proposal: jean.dupont@btp-dupont.fr}
    - choose: jean.dupont@btp-dupont.fr
      expect: {state: awaiting_validation, body_contains: ["parpaing", "mercredi"]}

- id: typo_lefebvre_and_spelling
  category: transcription
  description: Misspelled name and many spelling mistakes.
  turns:
    - user: "mail a helene lefebvre objet reunion dis lui ke je peu pas venir a la reunion de jeudi"
      expect: {reply_kind: ask_choice, top_proposal: helene.lefevre@mairie-lyon.fr}
    - choose: helene.lefevre@mairie-lyon.fr
      expect: {state: awaiting_validation, body_contains: ["jeudi"]}

- id: garbled_message
  category: transcription
  description: Incomprehensible message, the agent must not guess.
  turns:
    - user: "euh envoie le truc là à machin pour le… enfin tu vois pour demain quoi"
      expect: {state: collecting, reply_kind: [clarify, ask_recipient, ask_more_clues, ask_intent]}

- id: hesitant_voice_message
  category: transcription
  description: Hesitant message, understood after the user clarifies.
  turns:
    - user: "mail euh nadia haddad euh retard euh demain chantier euh trente minute"
      expect: {}
    - user: "Oui c'est ça : écris à Nadia Haddad que je serai en retard de 30 minutes demain au chantier."
      expect: {reply_kind: ask_choice, proposals_include: [nadia.haddad@orange.fr]}
    - choose: nadia.haddad@orange.fr
      expect: {state: awaiting_validation, body_contains: ["30|trente"]}
